# Сборка Android-версии в облаке GitHub. Ничего не нужно ставить на компьютер.
# Запускается при каждой загрузке файлов в репозиторий и вручную (Actions → Сборка Android → Run workflow).
# Готовый .apk появляется в разделе Releases — его можно скачать прямо с телефона.

name: Сборка Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Установить зависимости
        run: npm install --no-audit --no-fund

      - name: Собрать игру
        run: npm run build

      - name: Создать Android-проект
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Портретная ориентация
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'screenOrientation' "$M" || sed -i 's/android:name=".MainActivity"/android:name=".MainActivity"\n            android:screenOrientation="portrait"/' "$M"

      - name: Иконка и заставка
        continue-on-error: true # если не выйдет — останется стандартная иконка, сборка продолжится
        run: npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#17142a' --splashBackgroundColor '#17142a'

      - name: Номер версии
        run: |
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" "$G"
          sed -i "s/versionName \"[^\"]*\"/versionName \"0.1.${{ github.run_number }}\"/" "$G"

      - name: Собрать APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../tri-linii-0.1.${{ github.run_number }}.apk

      - name: Сохранить APK в Actions
        uses: actions/upload-artifact@v4
        with:
          name: tri-linii-apk
          path: tri-linii-*.apk

      - name: Опубликовать в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Три Линии 0.1.${{ github.run_number }}
          body: Тестовая сборка для Android. Скачай .apk на телефон и установи.
          files: tri-linii-*.apk
          prerelease: true
